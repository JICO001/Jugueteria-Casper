
name: Compilar Linux y macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 x86_64
            runner: ubuntu-22.04
            asset: JugueteriaCasper-ubuntu-22.04-x86_64.tar.gz

          - name: macOS Intel
            runner: macos-15-intel
            asset: JugueteriaCasper-macos-intel-x86_64.tar.gz


    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Instalar dependencias
        run: python -m pip install pyinstaller==6.22.3 colorama

      - name: Compilar aplicación
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name JugueteriaCasper
          --add-data "datos_iniciales/Inventario.db:datos_iniciales"
          main.py

      - name: Crear archivo comprimido
        run: |
          tar -czf "${{ matrix.asset }}" -C dist JugueteriaCasper

      - name: Adjuntar ejecutable a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.1 "${{ matrix.asset }}" --repo "$GITHUB_REPOSITORY" --clobber
